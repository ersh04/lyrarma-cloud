name: lyrarma-services-users

services:
  database:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyrarma-services-users
      POSTGRES_USER: lyrarma
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?USERS_DB_PASSWORD is required}
    ports:
      - "${USERS_DB_BIND_ADDRESS:-0.0.0.0}:${USERS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrarma -d lyrarma-services-users"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - users-postgres-data:/var/lib/postgresql/data

volumes:
  users-postgres-data:
