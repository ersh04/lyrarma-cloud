name: database
services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: lyrarma_cloud
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user-local-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lyrarma_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: