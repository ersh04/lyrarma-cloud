name: lyrarma-services-users
services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: lyrarma-services-users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user-local-password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lyrarma-services-users"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - users-postgres-data:/var/lib/postgresql/data

volumes:
  users-postgres-data:
